map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Colyseus HTTP matchmaking
    location /matchmake/ {
        proxy_pass http://game:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Account-API (Login, Registrierung, Profil)
    location /api/ {
        proxy_pass http://game:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    location @game {
        proxy_pass http://game:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite build output carries a content hash in the file name (name-XXXXXXXX.ext) and never changes.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|wasm|woff2?)$" {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime assets (GLB, KTX2, audio) keep stable names and are replaced in place: always revalidate.
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # WebSocket room connections go to the game server
        error_page 418 = @game;
        if ($http_upgrade ~* websocket) { return 418; }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
